name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build & audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (lockfile reproducido)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (producción)
        run: npm run build
        env:
          # Valor de build; no se despliega desde CI (Vercel compila aparte).
          NEXT_PUBLIC_API_URL: https://api.citero.app/api

      - name: Audit (high+)
        run: npm run audit
